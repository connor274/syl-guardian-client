[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "syl-guardian-client"
version = "0.1.0"
description = "Python client and CrewAI/LangChain tools for Syl Guardian, a causal guardrail that checks AI agent claims (e.g. ad spend lift) before they act."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
authors = [{ name = "Syl AI", email = "connor@sylai.io" }]
keywords = ["causal-inference", "guardrail", "ai-agents", "mcp", "crewai", "langchain", "ad-spend", "roas", "incrementality"]
classifiers = [
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Typing :: Typed",
]
dependencies = ["requests>=2.28"]

[project.optional-dependencies]
crewai = ["crewai>=0.100"]
langchain = ["langchain-core>=0.3"]
dev = ["pytest>=8"]

[project.urls]
Homepage = "https://sylai.io/guardian"
Documentation = "https://sylai.io/guardian/docs"
MCP = "https://github.com/connor274/syl-guardian-mcp"
Repository = "https://github.com/connor274/syl-guardian-client"

[tool.hatch.build.targets.wheel]
packages = ["src/syl_guardian_client"]

[tool.pytest.ini_options]
testpaths = ["tests"]
